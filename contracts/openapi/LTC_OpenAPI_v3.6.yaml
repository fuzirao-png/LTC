openapi: 3.1.0
info:
  title: LTC API
  version: v3.6.0
  description: |
    LTC current API contract for the v3.6 architecture baseline.
    Dialogue search is the only end-user lead source entry. Apollo is used only as an internal provider inside search execution.
    All timestamps use UTC RFC 3339.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: User
  - name: Lead Search
  - name: Candidate
  - name: Sales Lead
  - name: Company
  - name: Analysis
  - name: Operation
  - name: Job
  - name: Workspace
  - name: Knowledge
paths:
  /knowledge/search:
    post:
      tags: [Knowledge]
      operationId: searchKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
      responses:
        "200":
          description: Read-only knowledge search results from the configured WeKnora provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Knowledge provider unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: WeKnora is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      security: []
      responses:
        "200":
          description: Access token refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRefreshEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      responses:
        "204":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      responses:
        "200":
          description: Current authenticated user and capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags: [User]
      operationId: listUsers
      parameters:
        - name: account_type
          in: query
          schema:
            type: string
            enum: [sales, strategic]
        - name: region_code
          in: query
          schema:
            $ref: "#/components/schemas/RegionCode"
        - name: sales_tier
          in: query
          schema:
            $ref: "#/components/schemas/SalesTier"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: q
          in: query
          description: Case-insensitive display name or username search.
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: User list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [User]
      operationId: createUser
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [User]
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatchRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  "/users/{user_id}:disable":
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [User]
      operationId: disableUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: User disabled for login security. Business resources are not released by this command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCommandEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/users/{user_id}:enable":
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [User]
      operationId: enableUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Disabled account enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCommandEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/users/{user_id}:unlock":
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [User]
      operationId: unlockUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Login lock cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCommandEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/users/{user_id}:reset-password":
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [User]
      operationId: resetUserPassword
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: One-time temporary password issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/users/{user_id}:depart":
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [User]
      operationId: departUser
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartUserRequest"
      responses:
        "200":
          description: Active or disabled sales account marked as departed and owned leads returned to their original pools.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDepartEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /lead-search-runs:
    post:
      tags: [Lead Search]
      operationId: createLeadSearchRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadSearchRunCreateRequest"
      responses:
        "202":
          description: Search run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /lead-search-runs/{search_run_id}:
    parameters:
      - $ref: "#/components/parameters/SearchRunId"
    get:
      tags: [Lead Search]
      operationId: getLeadSearchRun
      responses:
        "200":
          description: Search run details and provider execution summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSearchRunEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  "/lead-search-runs/{search_run_id}:cancel":
    parameters:
      - $ref: "#/components/parameters/SearchRunId"
    post:
      tags: [Lead Search]
      operationId: cancelLeadSearchRun
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Search run cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/lead-search-runs/{search_run_id}:retry":
    parameters:
      - $ref: "#/components/parameters/SearchRunId"
    post:
      tags: [Lead Search]
      operationId: retryLeadSearchRun
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Search run retry accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /lead-candidates:
    get:
      tags: [Candidate]
      operationId: listLeadCandidates
      parameters:
        - name: search_run_id
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: scene_code
          in: query
          schema:
            $ref: "#/components/schemas/SceneCode"
        - name: required_sales_tier
          in: query
          schema:
            $ref: "#/components/schemas/SalesTier"
        - name: status
          in: query
          schema:
            type: string
            enum: [eligible, rejected, promoted, merged]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Candidate list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lead-candidates/{candidate_id}:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    get:
      tags: [Candidate]
      operationId: getLeadCandidate
      responses:
        "200":
          description: Candidate detail including scoring summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  "/lead-candidates/{candidate_id}:refresh-enrichment":
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Candidate]
      operationId: refreshCandidateEnrichment
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Enrichment refresh accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/lead-candidates/{candidate_id}:reject":
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Candidate]
      operationId: rejectCandidate
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Candidate rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCommandEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/lead-candidates/{candidate_id}:reopen":
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Candidate]
      operationId: reopenCandidate
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Candidate reopened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCommandEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/lead-candidates/{source_candidate_id}:merge":
    parameters:
      - $ref: "#/components/parameters/SourceCandidateId"
    post:
      tags: [Candidate]
      operationId: mergeCandidate
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateMergeRequest"
      responses:
        "202":
          description: Candidate merge accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  "/lead-candidates:select":
    post:
      tags: [Candidate]
      operationId: selectCandidates
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateSelectRequest"
      responses:
        "200":
          description: Batch select result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateSelectEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  "/lead-enrichment-runs/{run_id}:retry":
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Candidate]
      operationId: retryLeadEnrichmentRun
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Lead enrichment retry accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/lead-enrichment-runs/{run_id}:cancel":
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Candidate]
      operationId: cancelLeadEnrichmentRun
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Lead enrichment cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /sales-leads/pool:
    get:
      tags: [Sales Lead]
      operationId: listSalesLeadPool
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Claimable pool for the current sales account. Leads in region_unknown are hidden from Sales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesLeadListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sales-leads:
    get:
      tags: [Sales Lead]
      operationId: listAllSalesLeads
      parameters:
        - name: allocation_status
          in: query
          schema:
            $ref: "#/components/schemas/AllocationStatus"
        - name: owner_user_id
          in: query
          schema:
            type: string
        - name: required_sales_tier
          in: query
          schema:
            $ref: "#/components/schemas/SalesTier"
        - name: pool_region_code
          in: query
          schema:
            $ref: "#/components/schemas/RegionCode"
        - name: sla_state
          in: query
          schema:
            type: string
            enum: [pending, overdue, completed, not_applicable]
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Strategic global sales lead list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesLeadListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sales-leads/mine:
    get:
      tags: [Sales Lead]
      operationId: listMySalesLeads
      parameters:
        - name: pipeline_stage
          in: query
          schema:
            $ref: "#/components/schemas/PipelineStage"
        - name: allocation_status
          in: query
          schema:
            $ref: "#/components/schemas/AllocationStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Current user's owned sales leads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesLeadListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sales-leads/{lead_id}:
    parameters:
      - $ref: "#/components/parameters/LeadId"
    get:
      tags: [Sales Lead]
      operationId: getSalesLead
      responses:
        "200":
          description: Sales lead detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesLeadDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  "/sales-leads/{lead_id}:claim":
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      tags: [Sales Lead]
      operationId: claimSalesLead
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Lead claimed by current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResultEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/sales-leads/{lead_id}:assign":
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      tags: [Sales Lead]
      operationId: assignSalesLead
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        "200":
          description: Lead assigned to a matching sales account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResultEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  "/sales-leads/{lead_id}:release":
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      tags: [Sales Lead]
      operationId: releaseSalesLead
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Lead released back to its pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResultEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  "/sales-leads/{lead_id}:transfer":
    parameters:
      - $ref: "#/components/parameters/LeadId"
    post:
      tags: [Sales Lead]
      operationId: transferSalesLead
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Lead transferred to another matching sales account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResultEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

