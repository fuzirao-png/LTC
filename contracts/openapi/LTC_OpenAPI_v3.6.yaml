        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Job cancellation accepted by owning aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCommandEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /workspaces/sales:
    get:
      tags: [Workspace]
      operationId: getSalesWorkspace
      responses:
        "200":
          description: Sales workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesWorkspaceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /workspaces/strategic:
    get:
      tags: [Workspace]
      operationId: getStrategicWorkspace
      responses:
        "200":
          description: Strategic workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategicWorkspaceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboards/lead-funnel:
    get:
      tags: [Workspace]
      operationId: getLeadFunnelDashboard
      responses:
        "200":
          description: Lead funnel dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboards/allocation:
    get:
      tags: [Workspace]
      operationId: getAllocationDashboard
      responses:
        "200":
          description: Allocation dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboards/pipeline:
    get:
      tags: [Workspace]
      operationId: getPipelineDashboard
      responses:
        "200":
          description: Pipeline dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /companies/{company_id}/360:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      tags: [Workspace]
      operationId: getCompany360
      responses:
        "200":
          description: Customer 360 aggregate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer360Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SearchRunId:
      name: search_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SourceCandidateId:
      name: source_candidate_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    LeadId:
      name: lead_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CompanyId:
      name: company_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DimensionCode:
      name: dimension_code
      in: path
      required: true
      schema:
        type: string
        enum: [metrics, economic_buyer, decision_criteria, decision_process, paper_process, identify_pain, champion, competition]
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    SuggestionId:
      name: suggestion_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    EmailId:
      name: email_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ProviderCode:
      name: provider_code
      in: path
      required: true
      schema:
        type: string
        enum: [microsoft_graph, gmail]
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    NoteId:
      name: note_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Permission denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Uuid:
      type: string
      format: uuid
    AccountType:
      type: string
      enum: [sales, strategic]
    UserStatus:
      type: string
      enum: [active, disabled, departed]
    SalesTier:
      type: string
      enum: [MA, SA, A]
    RegionCode:
      type: string
      enum: [NA, EA, SEA, EU, ME, OTHER]
    SceneCode:
      type: string
      enum: [S1, S2, S3, S4]
    SearchMode:
      type: string
      enum: [company_only, contact_only, both]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed_final, cancelled]
    AllocationStatus:
      type: string
      enum: [claimable, claimed, released, won, lost]
    PipelineStage:
      type: string
      enum: [new, engaged, qualified, proposal, negotiation, won, lost]
    DataCompletionPool:
      type: string
      enum: [scale_unknown, region_unknown]
    RequestMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    PageMeta:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [request_id, error]
      properties:
        request_id:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [AUTH_INVALID_CREDENTIALS, USER_DEPARTED, SCENE_NOT_SUPPORTED, VERSION_CONFLICT]
            message:
              type: string
            details:
              type:
                - object
                - "null"
              additionalProperties: true
    JobRef:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/JobStatus"
        status_url:
          type: string
          example: /api/v1/jobs/3fa85f64-5717-4562-b3fc-2c963f66afa6
        events_url:
          type: string
          example: /api/v1/jobs/3fa85f64-5717-4562-b3fc-2c963f66afa6/events
    AsyncAcceptedEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [resource_type, resource_id, job]
          properties:
            resource_type:
              type: string
            resource_id:
              $ref: "#/components/schemas/Uuid"
            job:
              $ref: "#/components/schemas/JobRef"
    UserSummary:
      type: object
      required: [user_id, username, display_name, account_type, status]
      properties:
        user_id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
        display_name:
          type: string
        email:
          type:
            - string
            - "null"
          format: email
        account_type:
          $ref: "#/components/schemas/AccountType"
        status:
          $ref: "#/components/schemas/UserStatus"
        sales_tier:
          anyOf:
            - $ref: "#/components/schemas/SalesTier"
            - type: "null"
        region_code:
          anyOf:
            - $ref: "#/components/schemas/RegionCode"
            - type: "null"
        capacity_limit:
          type:
            - integer
            - "null"
        active_assignment_count:
          type: integer
    MeEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [user, capabilities]
          properties:
            user:
              $ref: "#/components/schemas/UserSummary"
            capabilities:
              type: array
              items:
                type: string
            token_expires_at:
              type:
                - string
                - "null"
              format: date-time
    SessionRefreshEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [refreshed]
          properties:
            refreshed:
              type: boolean
            token_expires_at:
              type: string
              format: date-time
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password, display_name, account_type]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        display_name:
          type: string
        email:
          type:
            - string
            - "null"
          format: email
        account_type:
          $ref: "#/components/schemas/AccountType"
        sales_tier:
          anyOf:
            - $ref: "#/components/schemas/SalesTier"
            - type: "null"
        region_code:
          anyOf:
            - $ref: "#/components/schemas/RegionCode"
            - type: "null"
        capacity_limit:
          type:
            - integer
            - "null"
          minimum: 1
    UserPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
        email:
          type:
            - string
            - "null"
          format: email
    UserEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          $ref: "#/components/schemas/UserSummary"
    UserListEnvelope:
      type: object
      required: [request_id, data, page]
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        page:
          $ref: "#/components/schemas/PageMeta"
    UserCommandEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [user_id, status, version]
          properties:
            user_id:
              $ref: "#/components/schemas/Uuid"
            status:
              $ref: "#/components/schemas/UserStatus"
            version:
              type: integer
    PasswordResetEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [user_id, temporary_password]
          properties:
            user_id:
              $ref: "#/components/schemas/Uuid"
            temporary_password:
              type: string
    DepartUserRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [employee_departure]
    UserDepartEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [user_id, status, released_lead_count, returned_pools, departed_at]
          properties:
            user_id:
              $ref: "#/components/schemas/Uuid"
            status:
              type: string
              enum: [departed]
            released_lead_count:
              type: integer
            returned_pools:
              type: array
              items:
                type: object
                required: [region_code, sales_tier, count]
                properties:
                  region_code:
                    $ref: "#/components/schemas/RegionCode"
                  sales_tier:
                    $ref: "#/components/schemas/SalesTier"
                  count:
                    type: integer
            departed_at:
              type: string
              format: date-time
    LeadSearchRunCreateRequest:
      type: object
      additionalProperties: false
      required: [query_text, search_mode, target_count, scene_code]
      properties:
        query_text:
          type: string
          minLength: 1
          maxLength: 4000
        search_mode:
          $ref: "#/components/schemas/SearchMode"
        target_count:
          type: integer
          minimum: 1
          maximum: 200
        scene_code:
          $ref: "#/components/schemas/SceneCode"
    ProviderExecutionSummary:
      type: object
      required: [provider_code, status, result_count]
      properties:
        provider_code:
          type: string
          enum: [web_search, apollo]
        status:
          type: string
          enum: [queued, running, succeeded, failed, partial]
        result_count:
          type: integer
        error_summary:
          type:
            - string
            - "null"
    LeadSearchRunSummary:
      type: object
      required: [search_run_id, query_text, search_mode, scene_code, status, provider_executions]
      properties:
        search_run_id:
          $ref: "#/components/schemas/Uuid"
        query_text:
          type: string
        search_mode:
          $ref: "#/components/schemas/SearchMode"
        scene_code:
          $ref: "#/components/schemas/SceneCode"
        status:
          type: string
          enum: [queued, running, succeeded, failed_final, cancelled, partial]
        current_step:
          type:
            - string
            - "null"
        progress_percent:
          type: number
        provider_executions:
          type: array
          items:
            $ref: "#/components/schemas/ProviderExecutionSummary"
        counts:
          type: object
          additionalProperties:
            type: integer
        current_job_id:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
    LeadSearchRunEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          $ref: "#/components/schemas/LeadSearchRunSummary"
    IcpSummary:
      type: object
      required: [scene_code, total_score, grade, dimensions]
      properties:
        scene_code:
          $ref: "#/components/schemas/SceneCode"
        total_score:
          type: number
        grade:
          type: string
          enum: [A, B, C, D]
        dimensions:
          type: array
          items:
            type: object
            required: [dimension_code, weight, score]
            properties:
              dimension_code:
                type: string
              weight:
                type: integer
              score:
                type: number
    ScaleSummary:
      type: object
      required: [required_sales_tier]
      properties:
        required_sales_tier:
          $ref: "#/components/schemas/SalesTier"
        effective_tier:
          type:
            - string
            - "null"
        score:
          type:
            - number
            - "null"
    CandidateSummary:
      type: object
      required: [candidate_id, company_name, status, scene_code]
      properties:
        candidate_id:
          $ref: "#/components/schemas/Uuid"
        company_name:
          type: string
        status:
          type: string
          enum: [eligible, rejected, promoted, merged]
        scene_code:
          $ref: "#/components/schemas/SceneCode"
        required_sales_tier:
          anyOf:
            - $ref: "#/components/schemas/SalesTier"
            - type: "null"
        pool_region_code:
          anyOf:
            - $ref: "#/components/schemas/RegionCode"
            - type: "null"
        data_completion_pool:
          anyOf:
            - $ref: "#/components/schemas/DataCompletionPool"
            - type: "null"
        icp:
          anyOf:
            - $ref: "#/components/schemas/IcpSummary"
            - type: "null"
        scale:
          anyOf:
            - $ref: "#/components/schemas/ScaleSummary"
            - type: "null"
        version:
          type: integer
    CandidateListEnvelope:
      type: object
      required: [request_id, data, page]
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CandidateSummary"
        page:
          $ref: "#/components/schemas/PageMeta"
    CandidateDetailEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/CandidateSummary"
            - type: object
              properties:
                search_run_id:
                  $ref: "#/components/schemas/Uuid"
                evidence_count:
                  type: integer
                contact_count:
                  type: integer
                notes:
                  type:
                    - string
                    - "null"
    CandidateMergeRequest:
      type: object
      additionalProperties: false
      required: [target_candidate_id, target_expected_version, reason]
      properties:
        target_candidate_id:
          $ref: "#/components/schemas/Uuid"
        target_expected_version:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 1
    CandidateSelectRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [candidate_id, expected_version, override]
            properties:
              candidate_id:
                $ref: "#/components/schemas/Uuid"
              expected_version:
                type: integer
                minimum: 0
              override:
                type: boolean
                default: false
              override_reason:
                type:
                  - string
                  - "null"
    CandidateSelectEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [succeeded, failed]
          properties:
            succeeded:
              type: array
              items:
                type: object
                required: [candidate_id, company_id, lead_id, promotion_result, allocation_status]
                properties:
                  candidate_id:
                    $ref: "#/components/schemas/Uuid"
                  company_id:
                    $ref: "#/components/schemas/Uuid"
                  lead_id:
                    $ref: "#/components/schemas/Uuid"
                  promotion_result:
                    type: string
                    enum: [created_lead, reused_open_lead, created_completion_lead]
                  allocation_status:
                    $ref: "#/components/schemas/AllocationStatus"
            failed:
              type: array
              items:
                type: object
                required: [candidate_id, code, message]
                properties:
                  candidate_id:
                    $ref: "#/components/schemas/Uuid"
                  code:
                    type: string
                  message:
                    type: string
    CandidateCommandEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          type: object
          required: [candidate_id, status, version]
          properties:
            candidate_id:
              $ref: "#/components/schemas/Uuid"
            status:
              type: string
            version:
              type: integer
    CompanySummary:
      type: object
      required: [company_id, name]
      properties:
        company_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        region_code:
          anyOf:
            - $ref: "#/components/schemas/RegionCode"
            - type: "null"
        country_code:
          type:
            - string
            - "null"
        website:
          type:
            - string
            - "null"
        industry:
          type:
            - string
            - "null"
    CurrentAssignmentSummary:
      type: object
      properties:
        assignment_id:
          $ref: "#/components/schemas/Uuid"
        owner_user_id:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        assigned_at:
          type:
            - string
            - "null"
          format: date-time
    SalesLeadSummary:
      type: object
      required: [lead_id, company, allocation_status, pipeline_stage, required_sales_tier, version]
      properties:
        lead_id:
          $ref: "#/components/schemas/Uuid"
        company:
          $ref: "#/components/schemas/CompanySummary"
        current_assignment:
          anyOf:
            - $ref: "#/components/schemas/CurrentAssignmentSummary"
            - type: "null"
        required_sales_tier:
          $ref: "#/components/schemas/SalesTier"
        icp_score:
          type:
            - number
            - "null"
        icp_grade:
          type:
            - string
            - "null"
        pool_region_code:
          anyOf:
            - $ref: "#/components/schemas/RegionCode"
            - type: "null"
        data_completion_pool:
          anyOf:
            - $ref: "#/components/schemas/DataCompletionPool"
            - type: "null"
        allocation_status:
          $ref: "#/components/schemas/AllocationStatus"
        pipeline_stage:
          $ref: "#/components/schemas/PipelineStage"
        sla_due_at:
          type:
            - string
            - "null"
          format: date-time
        icp_score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
        icp_grade:
          type:
            - string
            - "null"
          enum: [A, B, C, D, null]
        customer_size_grade:
          type:
            - string
            - "null"
          enum: [A, B, C, null]
        version:
          type: integer
    SalesLeadListEnvelope:
      type: object
      required: [request_id, data, page]
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SalesLeadSummary"
        page:
          $ref: "#/components/schemas/PageMeta"
    SalesLeadDetailEnvelope:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
        data:
          allOf:
            - $ref: "#/components/schemas/SalesLeadSummary"
            - type: object
              properties:
                adopted_icp:
                  anyOf:
                    - $ref: "#/components/schemas/IcpSummary"
                    - type: "null"
                adopted_scale:
                  anyOf:
                    - $ref: "#/components/schemas/ScaleSummary"
                    - type: "null"
                first_touched_at:
                  type:
                    - string
                    - "null"
                  format: date-time
                last_activity_at:
                  type:
                    - string
                    - "null"
                  format: date-time
    AssignRequest:
      type: object
      additionalProperties: false
      required: [assignee_user_id, reason_code, reason_text]
      properties:
        assignee_user_id:
          $ref: "#/components/schemas/Uuid"
        reason_code:
          type: string
          enum: [strategic_assignment]
        reason_text:
          type: string
    TransferRequest:
      type: object
      additionalProperties: false
      required: [to_assignee_user_id, reason_code, reason_text]
      properties:
        to_assignee_user_id:
          $ref: "#/components/schemas/Uuid"
