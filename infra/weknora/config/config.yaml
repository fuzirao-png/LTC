server:
  host: "0.0.0.0"
  port: 8080

conversation:
  max_rounds: 5
  keyword_threshold: 0.3
  embedding_top_k: 30
  vector_threshold: 0.2
  rerank_threshold: 0.3
  rerank_top_k: 30
  fallback_strategy: "model"
  fallback_response: "Sorry, I am unable to answer this question."
  fallback_prompt_id: "default_fallback_prompt"
  enable_rewrite: true
  enable_query_expansion: true
  enable_rerank: true
  rewrite_prompt_id: "default_rewrite"
  generate_summary_prompt_id: "default_summary"
  generate_session_title_prompt_id: "default_session_title"
  summary:
    max_input_chars: 16384
    repeat_penalty: 1.0
    temperature: 0.3
    max_completion_tokens: 2048
    no_match_prefix: |-
      <think>
      </think>
      NO_MATCH
    prompt_id: "default_kb"
    context_template_id: "default_context"
  extract_entities_prompt_id: "default_extract_entities"
  extract_relationships_prompt_id: "default_extract_relationships"
  generate_questions_prompt_id: "default_generate_questions"

knowledge_base:
  chunk_size: 512
  chunk_overlap: 50
  split_markers: ["\n\n", "\n", "。"]
  document_process_timeout: 2h
  image_processing:
    enable_multimodal: true

extract:
  extract_graph:
    description: |
      Based on the given text, extract core entities, their attributes, and
      relationships whose types are selected from: %s.
    tags:
      - "Author"
      - "Alias"
    examples:
      - text: |
          "Romeo and Juliet" is a tragedy written by William Shakespeare.
        node:
          - name: "Romeo and Juliet"
            attributes:
              - "A tragedy"
          - name: "William Shakespeare"
            attributes:
              - "Playwright"
        relation:
          - node1: "Romeo and Juliet"
            node2: "William Shakespeare"
            type: "Author"
  extract_entity:
    description: |
      Analyze the text, extract its key entities, and order them by relevance
      to the main topic without adding information that is not present.
    examples:
      - text: |
          "Romeo and Juliet" is a tragedy written by William Shakespeare.
        node:
          - name: "Romeo and Juliet"
          - name: "William Shakespeare"
  fabri_text:
    with_tag: |
      Please randomly generate a text related to %s, with a word count between
      [50-200], including relevant professional terms or typical elements.
    with_no_tag: |
      Please randomly generate a text with freely chosen content, with a word
      count between [50-200].

tenant:
  enable_cross_tenant_access: false
